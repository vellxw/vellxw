<svg xmlns="http://www.w3.org/2000/svg" width="600" height="710" viewBox="0 0 600 710" role="img" aria-labelledby="mobile-title mobile-desc">
<title id="mobile-title">Franco Compañy · Diseño digital + IA</title><desc id="mobile-desc">De una idea a una experiencia. Versión vertical con una animación decorativa de idea, interfaz y experiencia.</desc>
<defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#242722" opacity=".12"/></pattern>
    <clipPath id="round"><rect width="1200" height="520" rx="24"/></clipPath>
  </defs><style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#21241e}
    .mono{font-family:'Courier New',monospace;font-size:13px;letter-spacing:1.8px}
    .orbit{transform-origin:865px 260px;animation:orbit 28s linear infinite}
    .cursor{animation:cursor 8s ease-in-out infinite}
    .pulse{animation:pulse 8s ease-in-out infinite}
    .trace{stroke-dasharray:7 10;animation:trace 8s linear infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes cursor{0%,100%{transform:translate(0,0)}45%,60%{transform:translate(-20px,-14px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes trace{to{stroke-dashoffset:-68}}
    @media(prefers-reduced-motion:reduce){.orbit,.cursor,.pulse,.trace{animation:none!important}}
  </style>
